site_name: nedkit
site_description: >-
  XNEdit macros and Python utilities for the NED team at IPAC: cleaning up
  text pasted out of PDFs and reshaping it into NED's table format.
site_url: https://nedkit.sidereal.software/
repo_url: https://github.com/sidereal-software/nedkit
repo_name: nedkit
edit_uri: edit/main/docs/

theme:
  name: material
  # The same red and teal carry through both schemes rather than only the
  # light one.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/medical-bag
    repo: material/github
  # Hand-drawn from the same Material glyph as the logo. The bundled .icons
  # are template includes and never reach the built site, so a favicon has to
  # be a real file.
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    # content.code.copy is deliberately absent. Most blocks on this site are
    # output listings, and a copy button on one is an instruction to paste it
    # somewhere. Material attaches the button to a block carrying `.copy` even
    # with the feature off, so the button now means "this is meant to leave the
    # page" rather than "this is monospaced".
    - content.action.edit
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Collapsible blocks. tools/gen_docs.py folds each macro body into one.
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Inline icons, as in :material-bandage:. Same Material Design Icons set the
  # logo comes from, so the pictures on a page match the one in the header.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  # The default separator splits on whitespace and hyphens only, which makes
  # every identifier here one indivisible token: a reader searching
  # `read_only` or `macro_menu_command` or `XNEDIT` finds nothing, because the
  # index holds `$read_only` and `macro_menu_command` whole. This is Material's
  # own separator for code-heavy sites, splitting on underscores, on a dot not
  # followed by a digit so `v1.6.3` survives, and on case changes so
  # `macroCommands` is reachable from `Commands`.
  - search:
      separator: '[\s\-,:!=\[\]()"/_]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # The API reference comes from the docstrings rather than being written out
  # again by hand, the same principle tools/gen_docs.py applies to the macros.
  - mkdocstrings:
      handlers:
        python:
          # nedtransients ships as a directory the team copies, not as an
          # installed package, so it is not importable without this.
          paths: [python]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
            separate_signature: true

extra_css:
  - stylesheets/nedkit.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Cleaning up a pasted table: cleaning-pdf-tables.md
      - Installing macros: installing-macros.md
      - Preparing a SNe, FRB and GRB load: transients.md
  - Reference:
      - Commands: commands.md
      - Subroutines: subroutines.md
      - Character replacements: character-replacements.md
      - Macro language: xnedit-macro-reference.md
      - ned-transients API: transients-api.md
  - Contributing:
      - Running the tests: testing.md

# Every page has to be reachable from the nav; the docs workflow builds with
# --strict, so a page left out of the nav fails the build rather than going
# quietly missing from the site.
strict: true

# --strict alone does not check the fragment on a link, so a rename that breaks
# every deep link into the generated command reference would otherwise ship.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
