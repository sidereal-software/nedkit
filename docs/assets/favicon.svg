<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Material Design Icons "medical-bag", the same glyph as the site logo.
       An SVG favicon can carry its own stylesheet, so the bag follows the
       browser chrome rather than disappearing into a dark tab strip. -->
  <style>
    .bag { fill: #d32f2f; }
    .cross { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bag { fill: #ff5252; }
      .cross { fill: #1b1b1d; }
    }
  </style>
  <path class="bag" d="M10 3 8 5v2H5C3.85 7 3.12 8 3 9L2 19c-.12 1 .54 2 2 2h16c1.46 0 2.12-1 2-2L21 9c-.12-1-.94-2-2-2h-3V5l-2-2zm0 2h4v2h-4z"/>
  <path class="cross" d="M11 10h2v3h3v2h-3v3h-2v-3H8v-2h3z"/>
</svg>
